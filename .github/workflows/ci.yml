name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Bauen und testen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Die Bibliothek soll plattformunabhängig bleiben, also wird sie auf beiden gebaut.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore ConsoleRender.slnx

      - name: Bauen
        run: dotnet build ConsoleRender.slnx -c Release --no-restore

      - name: Testen
        run: dotnet test ConsoleRender.slnx -c Release --no-build

  publish:
    name: Nach nuget.org veröffentlichen
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      # Trusted Publishing: GitHub stellt ein signiertes OIDC-Token aus, das nuget.org
      # gegen einen kurzlebigen Schlüssel tauscht. Kein dauerhaftes Secret nötig.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Paket bauen
        run: dotnet pack src/ConsoleRender/ConsoleRender.csproj -c Release -o artifacts

      - name: Version ermitteln
        id: version
        run: |
          package=$(ls artifacts/*.nupkg | head -n 1)
          version=$(basename "$package" .nupkg | sed 's/^ConsoleRender\.//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Paketversion: $version"

      # Der geholte Schlüssel gilt nur eine Stunde, deshalb erst kurz vor dem Push.
      - name: Kurzlebigen Schlüssel holen
        uses: NuGet/login@v1
        id: login
        with:
          user: hopp1395

      # --skip-duplicate lässt einen Merge ohne Versionssprung durchlaufen, statt ihn
      # rot werden zu lassen. Veröffentlicht wird also erst, wenn <Version> im csproj steigt.
      - name: Veröffentlichen
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Zusammenfassung
        run: |
          echo "### ConsoleRender ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "An nuget.org gesendet. War die Version schon vorhanden, wurde sie übersprungen." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://www.nuget.org/packages/ConsoleRender/${{ steps.version.outputs.version }}>" >> "$GITHUB_STEP_SUMMARY"
